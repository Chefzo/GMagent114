name: Voice rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  voice-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run voice-rule tests
        run: npm test

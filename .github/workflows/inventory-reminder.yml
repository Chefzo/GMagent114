name: GM Agent — Inventory Reminder

# Emails a category-ordered count checklist so staff can do a quick physical
# count and reply with the numbers. Reads only the Sheet — no Toast, no writes.
# Cron is UTC; the example is 23:00 UTC Sunday (~6–7pm US Eastern), before the
# Monday order. Adjust to your count night/timezone.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run with fixtures only (no live APIs, no emails)"
        type: boolean
        default: false

jobs:
  inventory-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Send inventory count reminder
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_IMPERSONATE_USER: ${{ secrets.GOOGLE_IMPERSONATE_USER }}
          GM_SPREADSHEET_ID: ${{ secrets.GM_SPREADSHEET_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run inventory:reminder -- --dry-run
          else
            npm run inventory:reminder
          fi

name: CI

# Validates the project on every push/PR: typecheck, tests, and a dry-run of
# the ordering job (fixtures only — no network, no emails, no credentials).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ordering -- --dry-run

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (voice rules + lane logic)
        run: npm test
      - name: Dry-run smoke (digest pipeline)
        run: npm run smoke
        env:
          DIGEST_DRY_RUN: '1'
          TWILIO_DRY_RUN: '1'
          SLACK_DRY_RUN: '1'

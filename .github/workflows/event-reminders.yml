name: GM Agent — Event Reminders

# Reads upcoming bookings from Google Calendar and emails the owner a prep
# checklist per event. Read-only.
# Cron is UTC; the example is 15:00 UTC daily (~10–11am US Eastern). Adjust to
# your timezone; EVENT_REMINDER_DAYS sets the look-ahead window (default 7).
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run with fixtures only (no live APIs, no emails)"
        type: boolean
        default: false

jobs:
  event-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Send event reminders
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_IMPERSONATE_USER: ${{ secrets.GOOGLE_IMPERSONATE_USER }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GM_SPREADSHEET_ID: ${{ secrets.GM_SPREADSHEET_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run events:remind -- --dry-run
          else
            npm run events:remind
          fi

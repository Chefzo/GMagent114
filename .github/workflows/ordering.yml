name: GM Agent — Ordering

# Runs the ordering job on order mornings and drafts vendor orders for approval.
# Adjust the cron to your order days/timezone. Cron is UTC; the example below is
# 13:00 UTC (~8–9am US Eastern) on Monday and Thursday.
on:
  schedule:
    - cron: "0 13 * * 1,4"
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Run with fixtures only (no live APIs, no emails)"
        type: boolean
        default: false

jobs:
  ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run ordering job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_BASE_URL: ${{ secrets.TOAST_BASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_IMPERSONATE_USER: ${{ secrets.GOOGLE_IMPERSONATE_USER }}
          GM_SPREADSHEET_ID: ${{ secrets.GM_SPREADSHEET_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run ordering -- --dry-run
          else
            npm run ordering
          fi
